# Serves the SPA and proxies /api (REST, SSE and WebSocket) to the backend,
# so the browser only ever talks to one origin.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page is tiny and changes on every rebuild -- never cache it.
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~* \.(js|css)$ { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolve the backend per-request through Docker's embedded DNS. A bare
        # `proxy_pass http://backend:8000` is resolved once at startup, so nginx
        # refuses to boot (or serves stale IPs) whenever the backend is down.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
        proxy_http_version 1.1;

        # WebSocket upgrade for /api/ws/live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events and long-lived sockets must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        client_max_body_size 300m;
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
